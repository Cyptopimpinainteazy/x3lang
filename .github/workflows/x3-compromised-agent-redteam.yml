name: X3 Shield Compromised-Agent Red Team
on:
  pull_request:
    paths:
      - 'x3-lang/**'
      - 'scripts/hackathon/compromised_agent_redteam.py'
      - 'scripts/hackathon/test_compromised_agent_redteam.py'
      - 'scripts/hackathon/replay_grok_wallet_drain.py'
      - 'scripts/hackathon/test_replay_grok_wallet_drain.py'
      - '.github/workflows/x3-compromised-agent-redteam.yml'
  push:
    branches: [master]
    paths:
      - 'x3-lang/**'
      - 'scripts/hackathon/compromised_agent_redteam.py'
      - 'scripts/hackathon/test_compromised_agent_redteam.py'
      - 'scripts/hackathon/replay_grok_wallet_drain.py'
      - 'scripts/hackathon/test_replay_grok_wallet_drain.py'
      - '.github/workflows/x3-compromised-agent-redteam.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compromised-model-is-not-the-defence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install judge dependencies
        run: python -m pip install -r x3-lang/requirements.txt pytest
      - name: Offline red team with a model that complies with every attack
        run: |
          set -euo pipefail
          python3 scripts/hackathon/compromised_agent_redteam.py
          python3 -m pytest scripts/hackathon/test_compromised_agent_redteam.py -q
      - name: Replay the May 2026 Grok/Bankr wallet-drain pattern
        run: |
          set -euo pipefail
          python3 scripts/hackathon/replay_grok_wallet_drain.py
          python3 -m pytest scripts/hackathon/test_replay_grok_wallet_drain.py -q
