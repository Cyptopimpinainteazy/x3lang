name: X3Lang Exact-Head Local Execution Proof

on:
  pull_request:
    paths:
      - 'x3-lang/**'
      - 'scripts/proof/**'
      - '.github/CODEOWNERS'
      - '.github/mirror-policy.json'
      - '.github/scripts/exact_head_mirror_policy.py'
      - '.github/scripts/test_exact_head_mirror_policy.py'
      - '.github/workflows/x3lang-execution-proof.yml'
      - 'docs/security/X3LANG_EXACT_HEAD_MIRROR_POLICY.md'

permissions:
  contents: read

jobs:
  mirrored-proof-files:
    if: github.event_name == 'pull_request'
    name: Verify identical proof code in both GitHub repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: workspace
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 0
      - name: Test exact-head mirror policy
        env:
          PYTHONPATH: workspace/.github/scripts
        run: python3 workspace/.github/scripts/test_exact_head_mirror_policy.py -v
      - name: Require matching peer branch or an owner-approved narrow fallback
        env:
          PEER_BRANCH: ${{ github.head_ref }}
          PEER_URL: https://github.com/Cyptopimpinainteazy/xxxstar.git
          X3LANG_MIRROR_POLICY_APPROVAL_REFERENCE: ${{ vars.X3LANG_MIRROR_POLICY_APPROVAL_REFERENCE }}
        shell: bash
        run: |
          set -euo pipefail
          workspace_root="$GITHUB_WORKSPACE/workspace"
          policy_only=true
          while IFS= read -r changed; do
            case "$changed" in
              .github/CODEOWNERS|\
              .github/mirror-policy.json|\
              .github/scripts/exact_head_mirror_policy.py|\
              .github/scripts/test_exact_head_mirror_policy.py|\
              .github/workflows/x3lang-execution-proof.yml|\
              docs/security/X3LANG_EXACT_HEAD_MIRROR_POLICY.md) ;;
              *) policy_only=false ;;
            esac
          done < <(git -C "$workspace_root" diff --name-only \
            "${{ github.event.pull_request.base.sha }}...HEAD")
          if [[ "$policy_only" == true ]]; then
            runner="$workspace_root/.github/scripts/exact_head_mirror_policy.py"
          else
            git -C "$workspace_root" diff --quiet \
              "${{ github.event.pull_request.base.sha }}" -- \
              .github/scripts/exact_head_mirror_policy.py \
              scripts/proof/check_x3lang_mirror.py
            runner="$GITHUB_WORKSPACE/gate/.github/scripts/exact_head_mirror_policy.py"
          fi
          python3 "$runner" \
            --workspace "$workspace_root" \
            --peer-repo "$RUNNER_TEMP/x3lang-peer" \
            --peer-url "$PEER_URL" \
            --branch "$PEER_BRANCH" \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --peer-base-ref origin/master \
            --policy .github/mirror-policy.json

  x3lang-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang
      - name: Syntax-check both mirrored proof runners
        run: python3 -m py_compile scripts/proof/x3lang_execution_proof.py scripts/proof/x3lang_runtime_equivalence.py scripts/proof/check_x3lang_mirror.py
      - name: Execute exact-head compiler and VM proof
        run: python3 scripts/proof/x3lang_execution_proof.py --output-dir "$RUNNER_TEMP/x3lang-proof"
      - name: Publish signed-off-by-no-one evidence (not a chain proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x3lang-local-execution-proof
          path: ${{ runner.temp }}/x3lang-proof/
          if-no-files-found: warn
          retention-days: 14
