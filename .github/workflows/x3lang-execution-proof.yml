name: X3Lang Exact-Head Local Execution Proof

on:
  pull_request:
    paths:
      - 'x3-lang/**'
      - 'scripts/proof/x3lang_execution_proof.py'
      - 'scripts/proof/x3lang_runtime_equivalence.py'
      - 'scripts/proof/check_x3lang_mirror.py'
      - '.github/workflows/x3lang-execution-proof.yml'
      - 'tests/ci/test_private_peer_checkout.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirrored-proof-files:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Verify identical proof code in both GitHub repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require private peer read credential
        shell: bash
        env:
          X3LANG_PEER_READ_TOKEN: ${{ secrets.X3LANG_PEER_READ_TOKEN }}
        run: |
          if [[ -z "${X3LANG_PEER_READ_TOKEN:-}" ]]; then
            echo "::error::Missing X3LANG_PEER_READ_TOKEN (read-only Contents on private xxxstar repository)"
            exit 2
          fi
      - name: Checkout matching peer feature branch
        uses: actions/checkout@v4
        with:
          repository: Cyptopimpinainteazy/xxxstar
          token: ${{ secrets.X3LANG_PEER_READ_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          path: peer-checkout
          persist-credentials: false
          fetch-depth: 0
      - name: Reject mirrored-file drift
        run: python3 scripts/proof/check_x3lang_mirror.py --peer-repo peer-checkout --base-ref origin/master --peer-base-ref origin/master

  x3lang-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang
      - name: Test private peer authentication fail-closed policy
        run: python3 -m unittest discover -s tests/ci -p test_private_peer_checkout.py -v
      - name: Syntax-check both mirrored proof runners
        run: python3 -m py_compile scripts/proof/x3lang_execution_proof.py scripts/proof/x3lang_runtime_equivalence.py scripts/proof/check_x3lang_mirror.py
      - name: Execute exact-head compiler and VM proof
        run: python3 scripts/proof/x3lang_execution_proof.py --output-dir "$RUNNER_TEMP/x3lang-proof"
      - name: Publish signed-off-by-no-one evidence (not a chain proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x3lang-local-execution-proof
          path: ${{ runner.temp }}/x3lang-proof/
          if-no-files-found: warn
          retention-days: 14
