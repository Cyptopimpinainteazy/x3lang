name: X3Lang Exact-Head Local Execution Proof

on:
  pull_request:
    paths:
      - '.gitignore'
      - 'x3-lang/**'
      - 'scripts/proof/**'
      - 'tests/proof/**'
      - '.github/workflows/x3lang-execution-proof.yml'
      - 'tests/ci/test_private_peer_checkout.py'
      - 'tests/ci/test_standalone_checkout.py'
      - '.github/workflows/x3lang-peer-parity.yml'
      - 'tests/ci/test_proof_source_binding.py'
      - 'docs/security/STANDALONE_CI_POLICY.md'
      - 'AGENTS.md'
      - '.shipframe/profile.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-proof-inputs:
    name: Verify standalone committed proof inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test standalone and manual peer checkout policy
        run: python3 -m unittest discover -s tests/ci -p 'test_*checkout*.py' -v
      - name: Admit exact committed checkout without peer credentials
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/proof/check_x3lang_checkout.py --expected-head "$EXPECTED_HEAD" --output-dir "$RUNNER_TEMP/x3lang-checkout"
      - name: Publish source admission scope (not execution or parity proof)
        uses: actions/upload-artifact@v4
        with:
          name: x3lang-standalone-source-admission
          path: ${{ runner.temp }}/x3lang-checkout/checkout.json
          if-no-files-found: error
          retention-days: 14

  x3lang-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang
      - name: Test manual peer authentication fail-closed policy
        run: python3 -m unittest discover -s tests/ci -p test_private_peer_checkout.py -v
      - name: Test proof source binding before Cargo execution
        run: python3 -m unittest discover -s tests/ci -p test_proof_source_binding.py -v
      - name: Syntax-check both mirrored proof runners
        run: python3 -m py_compile scripts/proof/*.py
      - name: Test source binding and mirror failure boundaries
        run: python3 -m unittest discover -s tests/proof -p 'test_*.py' -v
      - name: Execute exact-head compiler and VM proof
        run: python3 scripts/proof/x3lang_execution_proof.py --output-dir "$RUNNER_TEMP/x3lang-proof"
      - name: Publish signed-off-by-no-one evidence (not a chain proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x3lang-local-execution-proof
          path: ${{ runner.temp }}/x3lang-proof/
          if-no-files-found: warn
          retention-days: 14
