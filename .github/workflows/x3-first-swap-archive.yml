name: X3 First Swap Immutable Evidence Replay
on:
  pull_request:
    paths:
      - 'evidence/tidepool-testnet/first-finalized-two-chain-certificate-20261107.json'
      - 'evidence/tidepool-testnet/first-signed-live-quote-20261107.json'
      - 'scripts/hackathon/verify_first_swap_archive.py'
      - 'scripts/hackathon/test_first_swap_archive.py'
      - 'scripts/hackathon/base_sepolia_guarded_admission.py'
      - 'scripts/hackathon/base_sepolia_x3_intent.py'
      - 'scripts/hackathon/two_chain_settlement_proof.py'
      - 'evidence/tidepool-testnet/pretrade-finalized-baseline-20261107.json'
      - 'x3-lang/*.py'
      - 'x3-lang/examples/base_sepolia_to_near_testnet_1usdc.x3'
      - 'docs/hackathon/FIRST_FINALIZED_SWAP_EVIDENCE.md'
      - '.github/workflows/x3-first-swap-archive.yml'
  push:
    branches: [master]
    paths:
      - 'evidence/tidepool-testnet/first-finalized-two-chain-certificate-20261107.json'
      - 'evidence/tidepool-testnet/first-signed-live-quote-20261107.json'
      - 'scripts/hackathon/verify_first_swap_archive.py'
      - 'scripts/hackathon/test_first_swap_archive.py'
      - 'scripts/hackathon/base_sepolia_guarded_admission.py'
      - 'scripts/hackathon/base_sepolia_x3_intent.py'
      - 'scripts/hackathon/two_chain_settlement_proof.py'
      - 'evidence/tidepool-testnet/pretrade-finalized-baseline-20261107.json'
      - 'x3-lang/*.py'
      - 'x3-lang/examples/base_sepolia_to_near_testnet_1usdc.x3'
      - 'docs/hackathon/FIRST_FINALIZED_SWAP_EVIDENCE.md'
      - '.github/workflows/x3-first-swap-archive.yml'
permissions:
  contents: read
jobs:
  offline-proof-and-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archived genuine signed quote and immutable finalized certificate
        env:
          PYTHONPATH: x3-lang:scripts/hackathon
        run: |
          set -euo pipefail
          python3 scripts/hackathon/verify_first_swap_archive.py
          python3 -m unittest scripts/hackathon/test_first_swap_archive.py -v
          python3 -m py_compile scripts/hackathon/verify_first_swap_archive.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git diff --check "${{ github.event.before }}" HEAD
          fi
      - name: Refuse signer or broadcaster in read-only audit
        run: |
          set -euo pipefail
          ! grep -Ei 'eth_sendRawTransaction|eth_sendTransaction|cast send|--private-key|sign_transaction|send_raw_transaction' scripts/hackathon/verify_first_swap_archive.py
