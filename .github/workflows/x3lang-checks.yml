name: X3Lang Standalone Checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test requirements
        run: python -m pip install -r x3-lang/requirements.txt pytest
      - name: Run X3Lang and NEAR adapter tests
        env:
          PYTHONPATH: x3-lang
        run: python -m pytest x3-lang/tests -q
      - name: Verify public browser demo
        run: node --test x3-lang/near/demo/test/*.test.mjs

  rust-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang
      - name: Test Rust X3Lang VM
        working-directory: x3-lang
        run: cargo test -p x3-lang-vm --locked --quiet
      - name: Check Rust formatting
        working-directory: x3-lang
        run: cargo fmt --all -- --check
      - name: Strict VM lint
        working-directory: x3-lang
        run: cargo clippy -p x3-lang-vm --all-targets --locked -- -D warnings

  near-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang/near/x3-guard
      - name: NEAR Guard unit tests
        working-directory: x3-lang/near/x3-guard
        run: cargo test --locked --quiet
