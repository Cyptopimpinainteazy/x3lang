name: X3Lang History and Reproducibility

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'sec/**']
  pull_request:
    branches: [master, 'integration/**']

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm historical baseline and exclusions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse baseline^{commit})" = a0a711e7381943fbe5544f6c0da3842e3a3bc89a
          git merge-base --is-ancestor baseline HEAD
          git merge-base --is-ancestor cb3e48a78bcdd5101048d5e57bcb7010196169ed HEAD
          test ! -e x3-lang/vm/src/liquidity.rs
          test ! -e x3-lang/vm/src/agent_firewall.rs
          test -f PRIOR_WORK.md
          grep -q 'baseline...master' PRIOR_WORK.md
          git diff --check baseline...HEAD -- PRIOR_WORK.md README.md .github/workflows/

  python-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r x3-lang/requirements.txt pytest
      - name: X3Lang Python and NEAR adapter tests
        env:
          PYTHONPATH: x3-lang
        run: python -m pytest x3-lang/tests scripts/hackathon/test_mainnet_agent_preflight.py scripts/hackathon/test_verify_mainnet_payment.py scripts/hackathon/test_route_probe.py scripts/hackathon/test_invoice06_chain.py scripts/hackathon/test_agent_law_doc.py -q
      - name: Browser demo
        run: node --test x3-lang/near/demo/test/*.test.mjs
      - name: Judge transaction lookup boundaries
        run: node --test x3-lang/near/judge-live/test/*.test.mjs
      - name: Offline three-track judge demo
        run: python scripts/hackathon/demo.py

  rust-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang
      - name: Test compiler, CLI corpus, and VM with archived proofs
        working-directory: x3-lang
        run: cargo test -p x3-lang-compiler -p x3-tools -p x3-lang-vm --locked --quiet
      - name: Formatting
        working-directory: x3-lang
        run: cargo fmt --all -- --check
      - name: Strict lint
        working-directory: x3-lang
        run: cargo clippy -p x3-lang-vm --all-targets --locked -- -D warnings

  near-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang/near/x3-guard
      - name: Install NEAR Guard WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Allocator gate failure regression tests
        run: python3 -m unittest discover -s tests/ci -p 'test_near_allocator_gate.py' -v
      - name: Ensure no abandoned wasm32 allocator in NEAR Guard
        run: bash scripts/check-near-allocator.sh
      - name: Rust NEAR Guard contract tests
        working-directory: x3-lang/near/x3-guard
        run: cargo test --locked --quiet
      - name: NEAR Guard formatting
        working-directory: x3-lang/near/x3-guard
        run: cargo fmt --all -- --check
      - name: Strict NEAR Guard lint
        working-directory: x3-lang/near/x3-guard
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build NEAR Guard WASM
        working-directory: x3-lang/near/x3-guard
        run: cargo build --target wasm32-unknown-unknown --release --locked
