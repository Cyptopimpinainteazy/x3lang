name: X3 Shield Native Vault Policy Compiler
on:
  pull_request:
    paths:
      - 'x3-lang/near_native_vault.py'
      - 'x3-lang/near_mandate.py'
      - 'x3-lang/near_intents.py'
      - 'x3-lang/cli.py'
      - 'x3-lang/registry.py'
      - 'x3-lang/tests/test_native_vault_policy.py'
      - 'x3-lang/examples/near_native_vault*.x3'
      - '.github/workflows/x3-native-vault-policy.yml'
  push:
    branches: [master]
    paths:
      - 'x3-lang/near_native_vault.py'
      - 'x3-lang/near_mandate.py'
      - 'x3-lang/near_intents.py'
      - 'x3-lang/cli.py'
      - 'x3-lang/registry.py'
      - 'x3-lang/tests/test_native_vault_policy.py'
      - 'x3-lang/examples/near_native_vault*.x3'
      - '.github/workflows/x3-native-vault-policy.yml'
permissions:
  contents: read
jobs:
  offline-policy-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve tracked compiler inputs for reproducibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-vault-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/native-vault-inputs/REVISION"
          git archive --format=tar.gz --output="$RUNNER_TEMP/native-vault-inputs/source.tar.gz" HEAD x3-lang
          sha256sum "$RUNNER_TEMP/native-vault-inputs/source.tar.gz"
      - name: Prepare isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/native-vault-venv"
          "$RUNNER_TEMP/native-vault-venv/bin/python" -m pip install -r x3-lang/requirements.txt
      - name: Test shared parser and native configuration binding (no node or funds)
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/x3-lang"
          "$RUNNER_TEMP/native-vault-venv/bin/python" -m unittest discover \
            -s x3-lang/tests -p test_native_vault_policy.py -v \
            2>&1 | tee "$RUNNER_TEMP/native-vault-inputs/tests.log"
      - name: Preserve source inputs and test output (not chain evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vault-policy-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-vault-inputs/
          if-no-files-found: error
          retention-days: 14
