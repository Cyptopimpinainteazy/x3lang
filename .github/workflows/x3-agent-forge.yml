name: X3 Agent Forge
on:
  pull_request:
    paths:
      - 'x3-lang/forge/**'
      - 'x3-lang/tests/test_agent_forge.py'
      - 'x3-lang/tests/test_forge_mesh.py'
      - 'x3-lang/gpu_mesh/**'
      - 'x3-lang/near_agent.py'
      - 'x3-lang/near_mandate.py'
      - 'x3-lang/near_intents.py'
      - 'x3-lang/agent_constitution.py'
      - 'x3-lang/agent_runtime.py'
      - 'deploy/forge/**'
      - 'deploy/desktop/**'
      - 'deploy/x3star/cf-access.mjs'
      - '.github/workflows/x3-agent-forge.yml'
  push:
    branches: [master]
    paths:
      - 'x3-lang/forge/**'
      - 'x3-lang/tests/test_agent_forge.py'
      - 'x3-lang/tests/test_forge_mesh.py'
      - 'deploy/forge/**'
      - '.github/workflows/x3-agent-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: x3-lang/forge/web/package-lock.json
      - run: python -m pip install -r x3-lang/requirements.txt pytest
      - name: Host, compiler path, Proving Ground, runtime births, connections
        run: PYTHONPATH=x3-lang python -m pytest x3-lang/tests/test_agent_forge.py -q
      - name: Mind on the GPU mesh (gate, budget, replay, revoke, real coordinator + worker, CLI)
        run: PYTHONPATH=x3-lang python -m pytest x3-lang/tests/test_forge_mesh.py -q
      - name: Web app typecheck, genome tests, build
        working-directory: x3-lang/forge/web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm ci
          npx tsc -b
          npx vitest run
          npx vite build
      - name: Deploy script (DNS helper tests, shellcheck, exact-commit release, origin refuses without Access)
        run: |
          set -euo pipefail
          node --test deploy/forge/*.test.mjs deploy/x3star/cf-access.test.mjs
          shellcheck -S style deploy/forge/deploy.sh
          shellcheck -S style deploy/desktop/x3-desktop.sh
          export X3_FORGE_HOME="$RUNNER_TEMP/forge"
          deploy/forge/deploy.sh release --ref "$GITHUB_SHA"
          cd "$X3_FORGE_HOME/current/x3-lang"
          FORGE_ACCESS_MODE=access FORGE_ACCESS_TEAM_DOMAIN=https://ci.cloudflareaccess.com \
            FORGE_ACCESS_AUD=$(printf 'a%.0s' {1..64}) FORGE_OWNER_EMAIL=owner@example.com PYTHONPATH=. \
            "$X3_FORGE_HOME/venv/bin/python" -m forge.server --port 7420 --data "$RUNNER_TEMP/forge-data" &
          trap 'kill $!' EXIT
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:7420/health && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7420/api/status)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7420/)" = 403
          if PYTHONPATH=. "$X3_FORGE_HOME/venv/bin/python" -m forge.server --host 0.0.0.0 --port 7421 --data "$RUNNER_TEMP/x"; then exit 1; fi
          echo FORGE_DEPLOY_OK
      - name: End-to-end (claim → compile → prove → birth → export/import → revoke)
        working-directory: x3-lang/forge/web
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-forge-e2e
          path: |
            x3-lang/forge/web/e2e-output/
            x3-lang/forge/web/test-results/
          if-no-files-found: ignore
