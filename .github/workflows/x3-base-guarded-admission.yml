name: X3 Guarded Base Sepolia Admission Proof
on:
  pull_request:
    paths:
      - 'scripts/hackathon/base_guarded_broadcast.py'
      - 'scripts/hackathon/test_base_guarded_broadcast.py'
      - 'scripts/hackathon/base_sepolia_guarded_admission.py'
      - 'scripts/hackathon/test_base_sepolia_guarded_admission.py'
      - 'x3-lang/near/x3-tidepool-guard/src/signed_live_fixture.json'
      - '.github/workflows/x3-base-guarded-admission.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/hackathon/base_guarded_broadcast.py'
      - 'scripts/hackathon/test_base_guarded_broadcast.py'
      - 'scripts/hackathon/base_sepolia_guarded_admission.py'
      - 'scripts/hackathon/test_base_sepolia_guarded_admission.py'
      - '.github/workflows/x3-base-guarded-admission.yml'
permissions:
  contents: read
jobs:
  test-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real signed quote offline and hard-denial matrix
        env:
          PYTHONPATH: x3-lang
        run: |
          set -euo pipefail
          python -m unittest scripts/hackathon/test_base_sepolia_guarded_admission.py scripts/hackathon/test_base_guarded_broadcast.py -v
          python -m py_compile scripts/hackathon/base_sepolia_guarded_admission.py scripts/hackathon/base_guarded_broadcast.py
          git diff --check
      - name: Preserve no-signing read-only preflight
        run: |
          set -euo pipefail
          ! grep -E 'cast send|eth_sendRawTransaction|--private-key|wallet sign|eth_sendTransaction' scripts/hackathon/base_sepolia_guarded_admission.py
