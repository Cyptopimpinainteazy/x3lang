name: X3 Shield Base Sepolia Custody Vault Pilot
on:
  pull_request:
    paths:
      - 'x3-lang/base-agent-vault/**'
      - 'scripts/hackathon/base_vault_quote_binding.py'
      - 'scripts/hackathon/test_base_vault_quote_binding.py'
      - 'scripts/hackathon/base_sepolia_guarded_admission.py'
      - 'scripts/hackathon/base_sepolia_x3_intent.py'
      - '.github/workflows/x3-base-agent-vault.yml'
  push:
    branches: [master]
    paths:
      - 'x3-lang/base-agent-vault/**'
      - 'scripts/hackathon/base_vault_quote_binding.py'
      - 'scripts/hackathon/test_base_vault_quote_binding.py'
      - 'scripts/hackathon/base_sepolia_guarded_admission.py'
      - 'scripts/hackathon/base_sepolia_x3_intent.py'
      - '.github/workflows/x3-base-agent-vault.yml'
permissions:
  contents: read
jobs:
  signed-quote-to-vault-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject altered signed quotes and mismatched vault or Guard terms
        env:
          PYTHONPATH: x3-lang:scripts/hackathon
        run: |
          python3 -m unittest scripts.hackathon.test_base_vault_quote_binding -v
          python3 -m unittest scripts.hackathon.test_base_sepolia_guarded_admission scripts.hackathon.test_tidepool_quote_signature -q
  foundry-vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Verify source formatting
        working-directory: x3-lang/base-agent-vault
        run: forge fmt --check
      - name: Adversarial vault tests with 256 fuzz runs each
        working-directory: x3-lang/base-agent-vault
        run: forge test --fuzz-runs 256 -vv
      - name: Build exact artifact (no signing or deployment)
        working-directory: x3-lang/base-agent-vault
        run: forge build --sizes
