name: Local agent-law lifecycle
on:
  pull_request:
    paths:
      - 'x3-lang/agent_*.py'
      - 'x3-lang/near_intents.py'
      - 'x3-lang/cli.py'
      - 'x3-lang/typechecker.py'
      - 'x3-lang/tests/test_agent_*.py'
      - 'scripts/hackathon/agent_law_local_demo.py'
      - '.github/workflows/agent-law-local.yml'
  push:
    branches: [master]
    paths:
      - 'x3-lang/agent_*.py'
      - 'x3-lang/tests/test_agent_*.py'
      - 'scripts/hackathon/agent_law_local_demo.py'
      - '.github/workflows/agent-law-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r x3-lang/requirements-agent-security.txt pytest
      - name: Real SQLite, signatures, compiler and failure cases
        run: |
          set -euo pipefail
          PYTHONPATH=x3-lang python -m pytest x3-lang/tests/test_agent_runtime*.py x3-lang/tests/test_agent_constitution.py x3-lang/tests/test_agent_admission_signed.py -q
          python -m compileall -q x3-lang/agent_runtime*.py scripts/hackathon/agent_law_local_demo.py
          python scripts/hackathon/agent_law_local_demo.py --output /tmp/agent-law-lifecycle.json
      - uses: actions/upload-artifact@v4
        with:
          name: local-agent-law-lifecycle
          path: /tmp/agent-law-lifecycle.json
          if-no-files-found: error
