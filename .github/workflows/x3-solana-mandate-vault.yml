name: X3 Solana Mandate Vault Verification

on:
  push:
    branches: ['feat/**', 'sec/**']
    paths:
      - 'x3-lang/solana/x3-mandate-vault/**'
      - '.github/workflows/x3-solana-mandate-vault.yml'
  pull_request:
    paths:
      - 'x3-lang/solana/x3-mandate-vault/**'
      - '.github/workflows/x3-solana-mandate-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x3-solana-mandate-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vault:
    name: Native Rust tests and actual SPL Token program-test CPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: x3-lang/solana/x3-mandate-vault
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: x3-lang/solana/x3-mandate-vault
      - name: Verify fixed policy serialization and negative-case unit tests
        run: cargo test --locked --lib --quiet
      - name: Verify actual Solana program-test and SPL Token CPI (not public chain)
        run: cargo test --locked --test vault_runtime -- --nocapture
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
