name: X3 Tidepool Testnet Guard Strict Gate
on:
  pull_request:
    paths:
      - 'x3-lang/near/x3-tidepool-guard/**'
      - '.github/workflows/x3-tidepool-testnet-guard.yml'
  push:
    branches: [master]
    paths:
      - 'x3-lang/near/x3-tidepool-guard/**'
      - '.github/workflows/x3-tidepool-testnet-guard.yml'
permissions:
  contents: read
jobs:
  testnet-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Audit format, native tests, clippy, WASM
        shell: bash
        working-directory: x3-lang/near/x3-tidepool-guard
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release --target wasm32-unknown-unknown
          sha256sum target/wasm32-unknown-unknown/release/x3_tidepool_testnet_guard.wasm
      - name: Reject testnet-to-mainnet trust confusion
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TIDEPOOL_MAKER:' x3-lang/near/x3-tidepool-guard/src/lib.rs
          grep -q 'testnet deployment only' x3-lang/near/x3-tidepool-guard/src/lib.rs
          git diff --check
