name: X3 Arbitrage local scanner
on:
  pull_request:
    paths:
      - 'x3-lang/arbitrage/**'
      - 'x3-lang/tests/test_arbitrage*.py'
      - 'x3-lang/near_liquidity/**'
      - 'x3-lang/near_intents.py'
      - '.github/workflows/x3-arbitrage.yml'
      - 'scripts/proof/arbitrage_roundtrip.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r x3-lang/requirements.txt pytest
      - name: Route economics, real SQLite, HTTP boundaries and compiler exports
        run: |
          PYTHONPATH=x3-lang python -m pytest x3-lang/tests/test_arbitrage*.py x3-lang/tests/test_near_liquidity_quotes.py x3-lang/tests/test_near_liquidity_rhea.py -q
          python -m compileall -q x3-lang/arbitrage scripts/proof/arbitrage_roundtrip.py
          python scripts/proof/arbitrage_roundtrip.py --output /tmp/x3-automatic-paper-proof.json
          node --test x3-lang/arbitrage/web/*.test.mjs
          node --check x3-lang/arbitrage/web/app.mjs
          node --check x3-lang/arbitrage/web/wallet-ui.mjs
