<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091428"/><stop offset="1" stop-color="#12122f"/></linearGradient><linearGradient id="accent"><stop stop-color="#56e4f4"/><stop offset="1" stop-color="#a38cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="17"/></filter></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1640" cy="110" r="270" fill="#5041ac" opacity=".13" filter="url(#glow)"/><circle cx="160" cy="950" r="260" fill="#067c9b" opacity=".12" filter="url(#glow)"/><text x="105" y="105" fill="#64dffa" font-family="Arial,sans-serif" font-size="43" font-weight="bold">X3 / X3LANG</text><rect x="105" y="127" width="1707" height="3" fill="#3d5875"/><text x="105" y="220" font-family="Arial,sans-serif" font-size="80" font-weight="bold" fill="#fff">HOW X3LANG WORKS</text><text x="105" y="275" font-family="Arial,sans-serif" font-size="32" font-weight="normal" fill="#b4cfe6">An AI proposes actions. The owner defines authority. X3Lang checks the boundary.</text><rect x="105" y="350" width="260" height="305" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><text x="129" y="411" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#69e5f7">01 · OWNER</text><text x="129" y="493" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#fff">Writes a .x3</text><text x="129" y="535" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#cad8e9">mandate</text><path d="M383 500 h58" stroke="#7adbef" stroke-width="7" stroke-linecap="round"/><path d="M430 488 l18 12 -18 12" fill="none" stroke="#7adbef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="468" y="350" width="260" height="305" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><text x="492" y="411" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#69e5f7">02 · COMPILER</text><text x="492" y="493" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#fff">Parses rules</text><text x="492" y="535" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#cad8e9">and validates</text><path d="M746 500 h58" stroke="#7adbef" stroke-width="7" stroke-linecap="round"/><path d="M793 488 l18 12 -18 12" fill="none" stroke="#7adbef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="831" y="350" width="260" height="305" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><text x="855" y="411" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#69e5f7">03 · AGENT</text><text x="855" y="493" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#fff">Proposes</text><text x="855" y="535" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#cad8e9">payment intent</text><path d="M1109 500 h58" stroke="#7adbef" stroke-width="7" stroke-linecap="round"/><path d="M1156 488 l18 12 -18 12" fill="none" stroke="#7adbef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1194" y="350" width="260" height="305" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><text x="1218" y="411" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#69e5f7">04 · X3 GUARD</text><text x="1218" y="493" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#fff">Checks asset,</text><text x="1218" y="535" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#cad8e9">amount, recipient</text><path d="M1472 500 h58" stroke="#7adbef" stroke-width="7" stroke-linecap="round"/><path d="M1519 488 l18 12 -18 12" fill="none" stroke="#7adbef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1557" y="350" width="260" height="305" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><text x="1581" y="411" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#69e5f7">05 · VERDICT</text><text x="1581" y="493" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#fff">Accept / review</text><text x="1581" y="535" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#cad8e9">or refuse</text><rect x="105" y="715" width="1707" height="212" rx="25" fill="#192c48" stroke="#507291" stroke-width="2"/><text x="154" y="776" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#6be5ed">EXAMPLE POLICY</text><text x="154" y="828" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="#fff">Spend ≤ 50 USDC  •  Only approved recipients  •  Fees / slippage capped  •  Refund destination fixed</text><text x="154" y="887" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#f7b76d">NO WALLET TRANSFER IS IMPLIED BY A PASSING POLICY CHECK</text><text x="105" y="1030" fill="#9fb3d0" font-family="Arial,sans-serif" font-size="24">NEAR Hackathon 2026   •   Source: Cyptopimpinainteazy/x3lang   •   Testnet ≠ settlement proof</text></svg>