<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091428"/><stop offset="1" stop-color="#12122f"/></linearGradient><linearGradient id="accent"><stop stop-color="#56e4f4"/><stop offset="1" stop-color="#a38cff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="17"/></filter></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1640" cy="110" r="270" fill="#5041ac" opacity=".13" filter="url(#glow)"/><circle cx="160" cy="950" r="260" fill="#067c9b" opacity=".12" filter="url(#glow)"/><text x="105" y="105" fill="#64dffa" font-family="Arial,sans-serif" font-size="43" font-weight="bold">X3 / X3LANG</text><rect x="105" y="127" width="1707" height="3" fill="#3d5875"/><text x="105" y="220" font-family="Arial,sans-serif" font-size="75" font-weight="bold" fill="#fff">ONE MANDATE. THREE VERDICTS.</text><text x="105" y="276" font-family="Arial,sans-serif" font-size="33" font-weight="normal" fill="#b4cfe6">Identical rules, different agent requests — deterministic outcomes</text><rect x="105" y="355" width="550" height="500" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><rect x="132" y="384" rx="14" width="226" height="69" fill="#45e4b9" opacity=".14"/><text x="149" y="432" font-family="Arial,sans-serif" font-size="39" font-weight="bold" fill="#45e4b9">ALLOW</text><text x="132" y="532" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">25 USDC → approved recipient</text><path d="M133 570 h491" stroke="#4a6483" stroke-width="2"/><text x="132" y="635" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#cad8e9">Every guard passes</text><text x="132" y="708" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#45e4b9">Intent may be registered</text><text x="132" y="794" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#aabbd0">Not a wallet transfer</text><rect x="685" y="355" width="550" height="500" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><rect x="712" y="384" rx="14" width="226" height="69" fill="#ffc766" opacity=".14"/><text x="729" y="432" font-family="Arial,sans-serif" font-size="39" font-weight="bold" fill="#ffc766">REVIEW</text><text x="712" y="532" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">40 USDC → approved recipient</text><path d="M713 570 h491" stroke="#4a6483" stroke-width="2"/><text x="712" y="635" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#cad8e9">Above 30 USDC threshold</text><text x="712" y="708" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#ffc766">Owner approval required</text><text x="712" y="794" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#aabbd0">Never auto-approved</text><rect x="1265" y="355" width="550" height="500" rx="25" fill="#253959" stroke="#507291" stroke-width="2"/><rect x="1292" y="384" rx="14" width="226" height="69" fill="#ff778e" opacity=".14"/><text x="1309" y="432" font-family="Arial,sans-serif" font-size="39" font-weight="bold" fill="#ff778e">REFUSE</text><text x="1292" y="532" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff">25 USDC → attacker.near</text><path d="M1293 570 h491" stroke="#4a6483" stroke-width="2"/><text x="1292" y="635" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#cad8e9">Recipient not allowlisted</text><text x="1292" y="708" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#ff778e">mandate_recipient fails</text><text x="1292" y="794" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#aabbd0">Blocked by NEAR Guard</text><text x="105" y="931" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#f7b76d">Demo logic: allow is a POLICY verdict, not authorization to spend funds.</text><text x="105" y="1030" fill="#9fb3d0" font-family="Arial,sans-serif" font-size="24">NEAR Hackathon 2026   •   Source: Cyptopimpinainteazy/x3lang   •   Testnet ≠ settlement proof</text></svg>