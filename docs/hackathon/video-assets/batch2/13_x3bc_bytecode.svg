<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071123"/><stop offset=".52" stop-color="#101a3a"/><stop offset="1" stop-color="#081628"/></linearGradient><radialGradient id="g"><stop stop-color="#574bd4" stop-opacity=".33"/><stop offset="1" stop-color="#574bd4" stop-opacity="0"/></radialGradient><pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0L0 0 0 70" fill="none" stroke="#3a5982" stroke-opacity=".14"/></pattern><style>@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-60}}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:14 12;animation:dash 3s linear infinite}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/><ellipse cx="1390" cy="490" rx="700" ry="540" fill="url(#g)"/><rect x="71" y="64" width="1778" height="941" rx="37" stroke="#405b84" stroke-opacity=".6" stroke-width="2" fill="none"/><text x="109" y="127" fill="#69e5fa" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="850" text-anchor="start">✦ X3LANG    /    X3 SHIELD</text><text x="1813" y="128" fill="#adc6e1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="end">X3BC / TRADING PATH</text><path d="M108 153 L1810 153" stroke="#365a80" stroke-width="2" stroke-linecap="round" fill="none"/><text x="110" y="235" fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="63" font-weight="900" text-anchor="start">13  /  CANONICAL X3BC BYTECODE</text><text x="110" y="291" fill="#bdcfe5" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="500" text-anchor="start">A shared no_std core defines bytecode semantics for the X3 trading path.</text><rect x="110" y="383" width="680" height="348" rx="24" fill="#0b1b33" stroke="#496b94" stroke-width="2"/><text x="144" y="445" fill="#68dff5" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="800" text-anchor="start">VERIFIED TRADING IR</text><text x="144" y="517" fill="#deeeff" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="600" text-anchor="start">atomic trade   →   canonical lowering</text><text x="144" y="589" fill="#deeeff" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="600" text-anchor="start">costs before profit checks</text><path d="M819 571 L986 571" stroke="#58dffd" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M973 560 L989 571 L973 582" fill="none" stroke="#58dffd" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="1044" y="371" width="668" height="463" rx="24" fill="#0c233d" stroke="#68bcf1" stroke-width="2"/><text x="1090" y="440" fill="#75eafa" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="800" text-anchor="start">X3BC  /  MODULE</text><rect x="1080" y="479" width="593" height="68" rx="14" fill="#162d46" stroke="#446381" stroke-width="2"/><text x="1102" y="523" fill="#e9f6ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="start">HEADER</text><text x="1455" y="523" fill="#92bdde" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start">version + format</text><rect x="1080" y="563" width="593" height="68" rx="14" fill="#162d46" stroke="#446381" stroke-width="2"/><text x="1102" y="607" fill="#e9f6ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="start">OPCODES</text><text x="1455" y="607" fill="#92bdde" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start">gas + traps</text><rect x="1080" y="647" width="593" height="68" rx="14" fill="#162d46" stroke="#446381" stroke-width="2"/><text x="1102" y="691" fill="#e9f6ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="2