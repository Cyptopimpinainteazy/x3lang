<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071123"/><stop offset=".52" stop-color="#101a3a"/><stop offset="1" stop-color="#081628"/></linearGradient><radialGradient id="g"><stop stop-color="#574bd4" stop-opacity=".33"/><stop offset="1" stop-color="#574bd4" stop-opacity="0"/></radialGradient><pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0L0 0 0 70" fill="none" stroke="#3a5982" stroke-opacity=".14"/></pattern><style>@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-60}}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:14 12;animation:dash 3s linear infinite}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/><ellipse cx="1390" cy="490" rx="700" ry="540" fill="url(#g)"/><rect x="71" y="64" width="1778" height="941" rx="37" stroke="#405b84" stroke-opacity=".6" stroke-width="2" fill="none"/><text x="109" y="127" fill="#69e5fa" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="850" text-anchor="start">✦ X3LANG    /    X3 SHIELD</text><text x="1813" y="128" fill="#adc6e1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="end">ARCHITECTURE BOUNDARY</text><path d="M108 153 L1810 153" stroke="#365a80" stroke-width="2" stroke-linecap="round" fill="none"/><text x="110" y="235" fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="63" font-weight="900" text-anchor="start">15  /  TWO RELATED PATHS</text><text x="110" y="291" fill="#bdcfe5" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="500" text-anchor="start">Don't confuse the X3 trading VM with the NEAR Shield hackathon adapter.</text><rect x="110" y="361" width="1677" height="237" rx="24" fill="#0d2840" stroke="#62c7e5" stroke-width="2"/><text x="152" y="424" fill="#76eaff" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="800" text-anchor="start">PATH A  /  X3 SHIELD ON NEAR</text><text x="152" y="489" fill="#f0f8ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="start">.x3 owner mandate   →   policy adapter   →   signed 1Click quote   →   NEAR Guard</text><text x="152" y="552" fill="#70ecbe" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">DEMONSTRATED: policy and contract checks on testnet</text><rect x="110" y="631" width="1677" height="244" rx="24" fill="#1a2040" stroke="#846fd7" stroke-width="2"/><text x="152" y="693" fill="#b39eff" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="800" text-anchor="start">PATH B  /  X3 TRADING VM</text><text x="152" y="759" fill="#f0f8ff" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="start">.x3 trading program   →   verified IR   →   canonical X3BC   →   X3VM</text><text x="152" y="825" fill="#f6c58b" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">SCOPE: compiler and interpreter; not a NEAR Guard execution claim</text><path d="M110 928 L1810 928" stroke="#355579" stroke-width="2" stroke-linecap="round" fill="none"/><text x="110" y="974" fill="#a8bcda" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start">The NEAR Guard does not execute canonical X3BC by virtue of sharing the X3Lang project.</text></svg>