it sent</text><text x="1419" y="646" fill="#f0e3ed" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">No 1Click payout</text><rect x="414" y="793" width="977" height="55" rx="27" fill="#102a3c" stroke="#ffb986" stroke-width="2"/><text x="439" y="830" fill="#ffb986" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="start">SIGNED QUOTE ≠ SETTLEMENT</text><path  d="M110 930 L1809 930" stroke="#395979" stroke-width="2" fill="none" stroke-linecap="round"/><text x="110" y="972" fill="#a9bfd7" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="550" text-anchor="start">The later funded Tidepool testnet transfer was a SEPARATE pilot route, not this 1Click session.</text></svg>