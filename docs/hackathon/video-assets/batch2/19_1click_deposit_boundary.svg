<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071424"/><stop offset=".6" stop-color="#161a3e"/><stop offset="1" stop-color="#08182b"/></linearGradient><radialGradient id="halo"><stop stop-color="#5b60e9" stop-opacity=".28"/><stop offset="1" stop-color="#5b60e9" stop-opacity="0"/></radialGradient><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" stroke="#345b86" opacity=".16" fill="none"/></pattern><style>@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes travel{to{stroke-dashoffset:-64}}.pulse{animation:pulse 2s ease-in-out infinite}.travel{stroke-dasharray:15 12;animation:travel 2s linear infinite}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/><ellipse cx="1420" cy="300" rx="680" ry="500" fill="url(#halo)"/><rect x="72" y="65" width="1776" height="940" rx="35" fill="none" stroke="#42648d" stroke-opacity=".55" stroke-width="2"/><text x="111" y="123" fill="#70e6f4" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="850" text-anchor="start">✦ X3LANG / X3 SHIELD</text><text x="1810" y="123" fill="#a9c7e7" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="end">DEPOSIT AUTHORIZATION</text><path  d="M110 150 L1809 150" stroke="#3b5c7a" stroke-width="2" fill="none" stroke-linecap="round"/><text x="110" y="238" fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="62" font-weight="900" text-anchor="start">19  /  APPROVAL IS NOT A TRANSFER</text><text x="110" y="296" fill="#b9cde8" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="500" text-anchor="start">A permitted 1Click quote authorizes a deposit address, not a funded swap.</text><rect x="115" y="377" width="1635" height="487" rx="24" fill="#0d1c35" stroke="#4a719e" stroke-width="2"/><rect x="154" y