150" y="777" fill="#fb8aa2" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="750" text-anchor="start">ANY FAILURE → REFUSE</text><path d="M110 928 L1810 928" stroke="#355579" stroke-width="2" stroke-linecap="round" fill="none"/><text x="110" y="974" fill="#a8bcda" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="500" text-anchor="start">The official 1Click dry quote was signed correctly but refused by policy; allowed live quote stopped before deposit.</text></svg>