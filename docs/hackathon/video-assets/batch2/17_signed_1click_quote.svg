<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071123"/><stop offset=".52" stop-color="#101a3a"/><stop offset="1" stop-color="#081628"/></linearGradient><radialGradient id="g"><stop stop-color="#574bd4" stop-opacity=".33"/><stop offset="1" stop-color="#574bd4" stop-opacity="0"/></radialGradient><pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M70 0L0 0 0 70" fill="none" stroke="#3a5982" stroke-opacity=".14"/></pattern><style>@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-60}}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:14 12;animation:dash 3s linear infinite}</style></defs><rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#grid)"/><ellipse cx="1390" cy="490" rx="700" ry="540" fill="url(#g)"/><rect x="71" y="64" width="1778" height="941" rx="37" stroke="#405b84" stroke-opacity=".6" stroke-width="2" fill="none"/><text x="109" y="127" fill="#69e5fa" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="850" text-anchor="start">✦ X3LANG    /    X3 SHIELD</text><text x="1813" y="128" fill="#adc6e1" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="750" text-anchor="end">1CLICK / QUOTE CHECK</text><path d="M108 153 L1810 153" stroke="#365a80" stroke-width="2" stroke-linecap="round" fill="none"/><text x="110" y="235" fill="#ffffff" font-family="DejaVu Sans,Arial,sans-serif" font-size="63" font-weight="900" text-anchor="start">17  /  A VALID SIGNATURE ISN'T PERMISSION</text><text x="110" y="291" fill="#bdcfe5" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="500" text-anchor="start">NEAR Guard verifies 1Click's signed terms, then applies owner rules.</text><rect x="112" y="377" width="728" height="438" rx="23" fill="#10263f" stroke="#6382a6" stroke-width="2