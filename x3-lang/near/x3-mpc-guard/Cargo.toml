[package]
name = "x3-mpc-guard"
version = "0.1.0"
edition = "2021"
description = "X3 mandate-bound signing authority for NEAR Chain Signatures (EVM EIP-1559). Draft; not deployed."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same SDK line and allocator choice as x3-guard (wee_alloc is RUSTSEC-2022-0054).
near-sdk = { version = "5.30", default-features = false }
# secp256k1 arithmetic for NEAR MPC public-key derivation, the same crate and
# version line the MPC contract uses (near/mpc Cargo.toml: k256 0.13.4).
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdsa"] }
# SHA3-256 for the MPC derivation tweak and Keccak-256 for EVM hashes/addresses
# (near/mpc Cargo.toml: sha3 0.10.8).
sha3 = { version = "0.10.8", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["unit-testing"] }
# Test-only: reproduce near/mpc's own key-derivation snapshot, whose root key is
# drawn from rand 0.8 `StdRng::from_seed([42; 32])`.
rand = { version = "0.8.5", default-features = false, features = ["std_rng"] }

# `cfg(near)` is set for wasm32 by .cargo/config.toml (as cargo-near does); see src/lib.rs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Standalone: not a member of any workspace, like x3-guard.
[workspace]
