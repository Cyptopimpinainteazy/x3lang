[package]
name = "x3-guard"
version = "0.1.0"
edition = "2021"
description = "On-chain X3 policy guard for intents settled through NEAR Intents (1Click)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
# Test-only: sign synthetic quotes with a throwaway key derived from a fixed seed.
ed25519-dalek = "2"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Standalone: not a member of the xxxstar root workspace, which pins its own toolchain.
[workspace]
