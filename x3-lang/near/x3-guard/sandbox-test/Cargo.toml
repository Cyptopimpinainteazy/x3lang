[package]
name = "x3-guard-sandbox-test"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local NEAR Sandbox integration test for the deployed x3-guard WASM"
license = "MIT OR Apache-2.0"

# Standalone: the guard contract is its own workspace. Do not join it.
[workspace]

[dev-dependencies]
near-sandbox = "=0.4.0"
near-api = "=0.8.7"
near-account-id = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
testresult = "=0.4.2"
