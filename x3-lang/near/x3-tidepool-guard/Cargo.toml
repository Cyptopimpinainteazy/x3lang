[package]
name = "x3-tidepool-testnet-guard"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated testnet-only X3 maker quote policy gate; not custody or mainnet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["unit-testing"] }
ed25519-dalek = "2"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[workspace]
