[package]
name = "x3-agent-vault-testnet"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
[lib]
crate-type = ["cdylib","rlib"]
[dependencies]
near-sdk = { version = "=5.30.0", default-features = false }
[dev-dependencies]
near-sdk = { version = "=5.30.0", default-features = false, features = ["unit-testing"] }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

