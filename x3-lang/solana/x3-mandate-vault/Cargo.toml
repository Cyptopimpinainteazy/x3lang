[package]
name = "x3-mandate-vault"
version = "0.1.0"
edition = "2021"
description = "Owner-controlled Solana SPL vault for exact-quote X3Lang agent mandates"
publish = false

# Standalone Solana/SBF crate; do not mix Agave dependencies with X3Lang's Rust VM workspace.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
# Solana's entrypoint macro checks these feature names; leave disabled by default.
custom-heap = []
custom-panic = []

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
solana-program = "2.3"
solana-system-interface = { version = "1.0", features = ["bincode"] }
solana-sdk-ids = "2.2"
spl-token = { version = "7.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
